name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '21' ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven

    - name: Build rollbase-shared-annotations
      run: cd rollbase-shared-annotations && mvn clean install -DskipTests

    - name: Build rollbase-shared
      run: cd rollbase-shared && mvn clean install -DskipTests

    - name: Build rollbase-merge
      run: cd rollbase-merge && mvn clean install -DskipTests

    # Uncomment when tests are migrated to JUnit 5
    # - name: Run tests
    #   run: mvn test

    - name: Upload rollbase-merge JAR
      uses: actions/upload-artifact@v4
      if: matrix.java == '17'
      with:
        name: rollbase-merge-jar-with-dependencies
        path: rollbase-merge/target/rollbase-merge-*-jar-with-dependencies.jar
        retention-days: 30
